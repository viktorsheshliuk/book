image: alpine:3.20

pipelines:
  branches:
    stage:
      - step:
          name: Deploy to Stage with Parallel FTP
          deployment: Stage
          script:
            - apk add --no-cache lftp
            - >
              lftp -u $FTP_USER,$FTP_PASSWORD -e "
              set ftp:ssl-allow no;
              set net:timeout 10;
              mirror -R --delete --verbose --parallel=10 
              --exclude .git/ 
              --exclude bitbucket-pipelines.yml 
              --exclude .gitignore 
              --exclude README.md 
              --exclude build/ 
              --exclude robots.txt 
              --exclude .htaccess 
              --exclude .htpasswd 
              --exclude config.php 
              --exclude admin/config.php 
              --exclude admin/cyberstore.php 
              --exclude cyberstore.php 
              --exclude php.ini 
              --exclude storage/logs/ 
              --exclude storage/cache/ 
              --exclude storage/session/ 
              --exclude storage/upload/ 
              --exclude storage/download/ 
              --exclude storage/modification/ 
              --exclude storage/exchange1c/ 
              --exclude storage/geoip/ 
              --exclude image/ 
              --exclude vqmod/logs/ 
              --exclude vqmod/vqcache/ 
              --exclude install/ 
              --exclude '.*\.log' 
              --exclude 'system/.*\.ocmod\.xml' 
              --exclude '.*\.xml' 
              ./ $TARGET_DIR;
              quit;
              " $FTP_HOST
            - echo "Deployment completed successfully!"