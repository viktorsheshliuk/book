image: alpine:3.20

pipelines:
  branches:
    stage:
      - step:
          name: Deploy to Stage
          deployment: Stage
          script:
            - apk add --no-cache rsync openssh-client
            - mkdir -p ~/.ssh
            # Добавляем ключ сервера в список доверенных
            - printf "Host %s\n\tStrictHostKeyChecking no\n" "$SSH_SERVER" >> ~/.ssh/config
            # Создаем целевую директорию на хостинге
            - ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "$SSH_USER@$SSH_SERVER" "mkdir -p '$TARGET_DIR'"
            # Синхронизация файлов
            - >
              rsync -az --delete
              --exclude=".git"
              --exclude="bitbucket-pipelines.yml"
              --exclude=".gitignore"
              --exclude="config.php"
              --exclude="admin/config.php"
              --exclude="admin/cyberstore.php"
              --exclude="cyberstore.php"
              --exclude="robots.txt"
              --exclude=".htaccess"
              --exclude=".htpasswd"
              --exclude="/php.ini"
              --exclude="storage/logs/"
              --exclude="storage/cache/"
              --exclude="storage/session/"
              --exclude="storage/upload/"
              --exclude="storage/download/"
              --exclude="storage/modification/"
              --exclude="storage/exchange1c/"
              --exclude="storage/geoip/"
              --exclude="image/"
              --exclude="image/cache/"
              --exclude="vqmod/logs/"
              --exclude="vqmod/vqcache/"
              --exclude="install/"
              --exclude="*.log"
              --partial --inplace --timeout=60
              -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT"
              ./ "$SSH_USER@$SSH_SERVER:$TARGET_DIR/"
            # Установка прав доступа
            - |
              ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "$SSH_USER@$SSH_SERVER" "
                cd '$TARGET_DIR' &&
                find . -type f -exec chmod 644 {} \; &&
                find . -type d -exec chmod 755 {} \; &&
                mkdir -p storage/{cache,logs,download,upload,modification,session} image &&
                chmod -R 777 storage/{cache,logs,download,upload,modification,session} image
              "
            - echo "Deployment to Stage completed successfully!"