name: Deploy OpenCart 3 via FTP (changed files only)

on:
  push:
    branches:
      - stage

concurrency:
  group: stage-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Get changed files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

      - name: Prepare deploy list
        run: |

          cat > exclude.txt <<'EXCLUDE'
          ^\.git
          ^\.github
          ^README\.md
          ^LICENSE
          ^build/
          ^robots\.txt
          ^\.htaccess
          ^\.htpasswd
          ^config\.php
          ^admin/config\.php
          ^admin/cyberstore\.php
          ^cyberstore\.php
          ^php\.ini
          ^image/
          ^storage/cache/
          ^storage/logs/
          ^storage/session/
          ^storage/upload/
          ^storage/download/
          ^storage/modification/
          ^storage/exchange1c/
          ^storage/geoip/
          ^vqmod/logs/
          ^vqmod/vqcache/
          ^install/
          .*\.log$
          .*\.ocmod\.xml$
          EXCLUDE

          grep -v -E -f exclude.txt changed_files.txt > deploy_files.txt || true

          echo "Files to deploy:"
          cat deploy_files.txt


      - name: Deploy via FTP
        if: hashFiles('deploy_files.txt') != ''
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |

          while read file; do

            if [ -z "$file" ]; then
              continue
            fi

            echo "Uploading: $file"

            lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
              set ftp:ssl-allow no;
              set net:timeout 20;
              set net:max-retries 3;
              mkdir -p $TARGET_DIR/$(dirname $file);
              put $file -o $TARGET_DIR/$file;
              quit;
            "

          done < deploy_files.txt