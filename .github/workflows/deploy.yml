name: Deploy via FTP

on:
  push:
    branches:
      - stage # Укажите вашу ветку, если она называется иначе

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          lftp -d -u "$FTP_USER","$FTP_PASSWORD" -e "
          set ftp:ssl-allow no;
          set net:timeout 10;
          mirror -R --delete --verbose --parallel=10 \
          --exclude .git/ \
          --exclude .github/ \
          --exclude .gitignore \
          --exclude README.md \
          --exclude build/ \
          --exclude robots.txt \
          --exclude .htaccess \
          --exclude .htpasswd \
          --exclude config.php \
          --exclude admin/config.php \
          --exclude admin/cyberstore.php \
          --exclude cyberstore.php \
          --exclude php.ini \
          --exclude storage/logs/ \
          --exclude storage/cache/ \
          --exclude storage/session/ \
          --exclude storage/upload/ \
          --exclude storage/download/ \
          --exclude storage/modification/ \
          --exclude storage/exchange1c/ \
          --exclude storage/geoip/ \
          --exclude image/ \
          --exclude vqmod/logs/ \
          --exclude vqmod/vqcache/ \
          --exclude install/ \
          --exclude '.*\.log' \
          --exclude 'system/.*\.ocmod\.xml' \
          --exclude '.*\.xml' \
          ./ $TARGET_DIR;
          quit;
          " $FTP_HOST