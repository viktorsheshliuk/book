name: Deploy OpenCart 3 via lftp

on:
  push:
    branches:
      - stage

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF

          set cmd:fail-exit yes

          set ftp:ssl-allow no

          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5

          set xfer:clobber on

          mirror -R \
            --verbose \
            --continue \
            --only-newer \
            --parallel=10 \
            --exclude-glob .git* \
            --exclude-glob .github/** \
            --exclude-glob README.md \
            --exclude-glob LICENSE \
            --exclude-glob build/** \
            --exclude-glob bitbucket-pipelines.yml \
            --exclude-glob .htaccess \
            --exclude-glob .htpasswd \
            --exclude-glob robots.txt \
            --exclude-glob php.ini \
            --exclude-glob config.php \
            --exclude-glob admin/config.php \
            --exclude-glob cyberstore.php \
            --exclude-glob admin/cyberstore.php \
            --exclude-glob install/** \
            --exclude-glob image/** \
            --exclude-glob storage/cache/** \
            --exclude-glob storage/logs/** \
            --exclude-glob storage/session/** \
            --exclude-glob storage/upload/** \
            --exclude-glob storage/download/** \
            --exclude-glob storage/modification/** \
            --exclude-glob storage/exchange1c/** \
            --exclude-glob storage/geoip/** \
            --exclude-glob vqmod/logs/** \
            --exclude-glob vqmod/vqcache/** \
            --exclude-glob *.log \
            --exclude-glob *.ocmod.xml \
            ./ "$TARGET_DIR"

          quit
          EOF