name: Deploy via FTP

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.TARGET_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/bitbucket-pipelines.yml
            **/README.md
            **/build/**
            **/robots.txt
            **/.htaccess
            **/.htpasswd
            **/config.php
            **/admin/config.php
            **/admin/cyberstore.php
            **/cyberstore.php
            **/php.ini
            **/storage/logs/**
            **/storage/cache/**
            **/storage/session/**
            **/storage/upload/**
            **/storage/download/**
            **/storage/modification/**
            **/storage/exchange1c/**
            **/storage/geoip/**
            **/image/**
            **/vqmod/logs/**
            **/vqmod/vqcache/**
            **/install/**
            **/*.log
            **/system/*.ocmod.xml
            **/*.xml