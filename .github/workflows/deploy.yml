name: Deploy OpenCart 3 via FTP

on:
  push:
    branches:
      - stage

concurrency:
  group: stage-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy changed files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp


      - name: Get changed files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt


      - name: Prepare deploy list
        run: |

          cat > exclude.txt <<'EXCLUDE'
          ^\.git
          ^\.github
          ^README\.md
          ^LICENSE
          ^build/
          ^robots\.txt
          ^\.htaccess
          ^\.htpasswd
          ^config\.php
          ^admin/config\.php
          ^admin/cyberstore\.php
          ^cyberstore\.php
          ^php\.ini

          ^image/

          ^storage/cache/
          ^storage/logs/
          ^storage/session/
          ^storage/upload/
          ^storage/download/
          ^storage/modification/
          ^storage/exchange1c/
          ^storage/geoip/

          ^vqmod/logs/
          ^vqmod/vqcache/

          ^install/

          .*\.log$
          .*\.ocmod\.xml$
          EXCLUDE


          grep -v -E -f exclude.txt changed_files.txt > deploy_files.txt || true


          echo "Files for deploy:"
          cat deploy_files.txt



      - name: Deploy via FTP
        if: hashFiles('deploy_files.txt') != ''
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}

        run: |

          cat > lftp_commands.txt <<EOF
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set cmd:parallel 10
          EOF


          while IFS= read -r file
          do

            if [ -z "$file" ]; then
              continue
            fi

            echo "Uploading command: $file"

            dirname=$(dirname "$file")

            echo "mkdir -p $TARGET_DIR/$dirname" >> lftp_commands.txt

            echo "put \"$file\" -o \"$TARGET_DIR/$file\"" >> lftp_commands.txt

          done < deploy_files.txt


          echo "quit" >> lftp_commands.txt


          echo "Final LFTP commands:"
          cat lftp_commands.txt


          lftp \
            -u "$FTP_USER","$FTP_PASSWORD" \
            "$FTP_HOST" < lftp_commands.txt